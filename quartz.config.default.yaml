# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 개발자 유니의 두 번째 뇌
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-GJFBQJ80N7
  locale: ko-KR
  baseUrl: shin-jae-yoon.github.io
  generatedPageDate: 2026-07-19T00:00:00+09:00
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      # The page CSS owns the Korean-capable system stack. These names retain
      # the existing local OG-image cache without emitting any webfont request.
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f7fafa"
        lightgray: "#d9e3e4"
        gray: "#52666a"
        darkgray: "#334c50"
        dark: "#102a2e"
        secondary: "#187c87"
        tertiary: "#d96f69"
        highlight: rgba(24, 124, 135, 0.12)
        textHighlight: "#fff23688"
      darkMode:
        light: "#0b151a"
        lightgray: "#294048"
        gray: "#a9b9bc"
        darkgray: "#c6d3d5"
        dark: "#eaf2f3"
        secondary: "#67c8d0"
        tertiary: "#f29a94"
        highlight: rgba(103, 200, 208, 0.14)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: dev-uni-toc
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: local
      title: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif'
      header: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif'
      body: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif'
      interface: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif'
      code: 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: Brain
      rootPath: brain
      folderDefaultState: collapsed
      folderClickBehavior: collapse
      useSavedState: true
      # Under these subtrees the folder that sits directly above the leaf files
      # opens its own page when clicked. Everywhere else a folder only collapses.
      leafLinkPaths:
        - brain/books
        - brain/lectures
    layout:
      position: left
      priority: 50
      condition: dev-uni-explorer
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        includePathPrefixes:
          - brain
        depth: 2
        showTags: false
      globalGraph:
        includePathPrefixes:
          - brain
        showTags: false
        enableRadial: false
        repelForce: 0.35
        centerForce: 0.25
        linkDistance: 42
    layout:
      position: right
      priority: 10
      condition: dev-uni-graph
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 40
      condition: dev-uni-backlinks
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: header
      priority: 35
      group: toolbar
      condition: dev-uni-reader-mode
  - source: github:quartz-community/breadcrumbs
    options:
      hiddenSegments:
        - tistory
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: Shin-Jae-Yoon/Shin-Jae-Yoon.github.io
        repoId: R_kgDOI3_Rgg
        category: Announcements
        categoryId: DIC_kwDOI3_Rgs4DEl_c
        # 경로로 글과 Discussion 을 잇는다. url 은 쿼리스트링까지 키에 넣어
        # 같은 글에 Discussion 이 여러 개 생길 수 있다. 예전 utterances 도 pathname 이었다.
        mapping: pathname
        # 본문의 sha1 해시로 대조한다. GitHub 의 흐릿한 검색에 걸려 엉뚱한 글타래가
        # 붙는 것을 막는다.
        strict: true
        lang: ko
        reactionsEnabled: true
        inputPosition: bottom
    layout:
      position: afterBody
      priority: 10
      condition: dev-uni-comments
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/Shin-Jae-Yoon
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
      condition: dev-uni-garden
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      template: minimal
      positions:
        header: []
        beforeBody: []
        left: []
        right: []
    content:
      template: dev-uni
    folder:
      template: dev-uni
    tag:
      template: dev-uni
    canvas:
      template: dev-uni
    bases:
      template: dev-uni
