name: Quartz Pages artifact (staged, no deploy)

# This file is intentionally staged below migration/quartz-v5. GitHub only
# discovers workflows in the repository-root .github/workflows directory, so
# owner cutover must explicitly move this file before it can run remotely.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: migration/quartz-v5

jobs:
  build-pages-artifact:
    name: Verify and package preview artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: migration/quartz-v5/package-lock.json

      - name: Install exact npm
        run: npm install --global npm@10.9.7

      - name: Verify exact toolchain
        run: test "$(node --version)" = "v22.22.2" && test "$(npm --version)" = "10.9.7"

      - name: Clean install
        run: npm ci

      - name: Install pinned Quartz plugins
        run: npm run install-plugins

      - name: Run fail-closed G013 build and final verification
        run: node ../g013/generate-final-verification.mjs

      - name: Validate G010 cutover handoff against G013
        run: node ../g010/validate-handoff.mjs

      - name: Rebind upload input to the accepted artifact manifest
        run: npm run artifact:verify-accepted

      - name: Upload Pages-compatible preview artifact (never deploy)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: migration/quartz-v5/public
          retention-days: 7
